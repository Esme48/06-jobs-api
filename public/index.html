<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>
  </head>

  <body>
    <h1>Customer Dashboard</h1>
    <hr />
    <p id="message"></p>
    <hr />
    <div id="logon-register" style="display:none;">
      <button type="button" id="logon">Logon</button>
      <button type="button" id="register">Register</button>
    </div>
    <div id="logon-div" style="display:none;">
      <form>
        <div>
          <label for="email">email:</label>
          <input type="email" id="email" />
        </div>
        <div>
          <label for="password">password:</label>
          <input type="password" id="password" />
        </div>
        <button type="button" id="logon-button">logon</button>
        <button type="button" id="logon-cancel">cancel</button>
      </form>
    </div>
    <div id="register-div" style="display:none;">
      <form>
        <div>
          <label for="name">name:</label>
          <input type="text" id="name" />
        </div>
        <div>
          <label for="email1">email:</label>
          <input type="email" id="email1" />
        </div>
        <div>
          <label for="password1">password:</label>
          <input type="password" id="password1" />
        </div>
        <div>
          <label for="password2">verify password:</label>
          <input type="password" id="password2" />
        </div>
        <button type="button" id="register-button">register</button>
        <button type="button" id="register-cancel">cancel</button>
      </form>
    </div>
    <div id="cart" style="display:none;">
      <p id="cart-message"></p>
      <table id="cart-table">
        <tr id="cart-table-header">
          <th>Item</th>
          <th>Color</th>
          <th>Status</th>
          <th colspan="2"></th>
        </tr>
      </table>
      <button type="button" id="add-item">add item</button>
      <button type="button" id="logoff">log off</button>
    </div>
    <div id="edit-item" style="display:none;">
      <form>
        <div>
          <label for="item">item:</label>
          <input type="text" id="item" />
        </div>
        <div>
          <label for="color">color:</label>
          <input type="text" id="color" />
        </div>
        <div>
          <label for="status">status:</label>
          <select id="status">
            <option value="Item Pending Review">Item Pending Review</option>
            <option value="Item Shipped">Item Shipped</option>
            <option value="Item Delivered">Item Delivered</option>
          </select>
        </div>
        <button type="button" id="adding-item">add</button>
        <button type="button" id="edit-cancel">cancel</button>
      </form>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
